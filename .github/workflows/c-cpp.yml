name: C/C++ CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test-linux:
    runs-on: xcp-medium-4g
    container:
      image: harbor.svc.xyme.cloud/xcp/test-runner:python
    steps:
      - name: Checkout repo
        uses: xymeai/xyme-github-actions/checkout@main

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc g++ make libnetcdf-dev
          rm -rf /var/lib/apt/lists/*

      - name: Build fpocket
        run: make fpocket

      - name: Install test dependencies
        run: uv pip install --system pytest numpy

      - name: Run tests
        run: pytest
